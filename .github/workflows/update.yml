name: Update photobook

on:
  schedule:
    - cron: "0 22 * * *"      # every day at 05:00 Vietnam time
  push:
    paths:
      - photographers.yml     # also update right after you edit your list
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: photobook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install pyyaml playwright
          python -m playwright install --with-deps chromium
      - name: Collect photos
        run: python fetch.py
      - name: Save new photos list
        run: |
          git config user.name "photobook-bot"
          git config user.email "photobook-bot@users.noreply.github.com"
          git add images.json status.json
          git diff --cached --quiet || (git commit -m "Update photos" && git pull --rebase && git push)

