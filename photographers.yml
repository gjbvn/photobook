# ─────────────────────────────────────────────────────────────
#  YOUR PHOTOGRAPHERS
#
#  To add someone, copy one block (from "- name:" down to the
#  "lists:" line), paste it below the others and change the details.
#  Keep the spaces at the start of each line exactly as they are.
#
#  name:   how their name shows in the book
#  site:   the web page where their photos are
#  lists:  your categories, in square brackets, separated by commas
#  note:   (optional) a line of your own about them
#
#  Optional extras, only if a site doesn't work well:
#  pages:  several pages to collect from, instead of just "site"
#  feeds:  an RSS feed address to use as well
#  follow: open the links on the page that contain this text
#          and take the main photo from each (good for shops/galleries)
#
#  After you save ("Commit changes"), the book updates itself
#  within a few minutes.
# ─────────────────────────────────────────────────────────────

