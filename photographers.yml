suggested:

  - name: Craig Whitehead
    site: https://www.sixstreetunder.com
    lists: [Street]
    note: Fine-art street photography built on light, shadow and colour. Close to Roman Fox's eye.

  - name: Willem Verbeeck
    site: https://www.willemverbeeck.com
    lists: [Film, Street]
    note: Film photographer of quiet American cities and towns. Fits alongside Grainydays.

