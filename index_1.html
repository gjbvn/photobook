<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3efe6">
<script>
  // Pick light or dark before the page draws, so it never flashes the wrong colours
  (() => { let t = null; try { t = localStorage.getItem("photobook_theme"); } catch {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photobook">
<title>Photobook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe6;
    --leaf: #faf8f3;
    --ink: #24211c;
    --muted: #8b8478;
    --rule: #d9d2c4;
    --accent: #8c2f1e;
    --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --shade: rgba(60,50,30,.08);
    --shade2: rgba(60,50,30,.25);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --paper: #151412;
    --leaf: #1d1b18;
    --ink: #ebe5d8;
    --muted: #8f887b;
    --rule: #37332d;
    --accent: #d98b6c;
    --shade: rgba(0,0,0,.35);
    --shade2: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  html[data-theme="dark"] .leaf figure img { box-shadow: 0 0 0 1px rgba(255,255,255,.03); }
  .theme { color: var(--muted); font-size: 15px; font-style: italic; white-space: nowrap; }
  .theme:hover { color: var(--ink); }
  .mast-top { display: flex; justify-content: flex-end; margin-bottom: -8px; }
  .bar-r { display: flex; gap: 16px; align-items: center; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--serif); font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .sc { font-variant: small-caps; letter-spacing: .08em; text-transform: lowercase; }
  .muted { color: var(--muted); }

  /* ───────── Contents ───────── */
  #contents { max-width: 680px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 24px 80px; }
  .mast { text-align: center; padding: 32px 0 40px; border-bottom: 1px solid var(--rule); }
  .mast h1 { font-weight: 400; font-style: italic; font-size: 56px; line-height: 1; margin: 0 0 10px; letter-spacing: -.01em; }
  .mast p { margin: 0; color: var(--muted); font-size: 16px; }

  .latest { display: block; width: 100%; text-align: left; margin: 36px 0 8px; padding: 0; }
  .latest .strip { display: flex; gap: 6px; height: 120px; overflow: hidden; border-radius: 2px; }
  .latest .strip img { height: 100%; width: auto; flex: 0 0 auto; object-fit: cover; background: var(--rule); }
  .latest .label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .latest .label b { font-weight: 500; font-size: 20px; }

  .part { margin-top: 44px; }
  .part-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 6px; }
  .part-head h2 { margin: 0; font-weight: 400; font-size: 26px; }
  .part-head h2 .num { color: var(--accent); font-size: 18px; margin-right: 10px; }
  .part-head button { color: var(--muted); font-size: 15px; font-style: italic; }
  .part-head button:hover { color: var(--ink); }

  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; cursor: pointer; }
  .toc li .name { white-space: nowrap; }
  .toc li .dots { flex: 1; border-bottom: 1px dotted var(--muted); transform: translateY(-5px); opacity: .6; min-width: 20px; }
  .toc li .pg { color: var(--muted); font-size: 15px; white-space: nowrap; font-variant-numeric: oldstyle-nums; }
  .toc li .new { color: var(--accent); font-size: 13px; font-style: italic; }
  .toc li:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  .suggest { margin-top: 56px; }
  .suggest .card { padding: 16px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 84px 1fr; gap: 16px; cursor: pointer; }
  .suggest .card .thumb { width: 84px; height: 84px; object-fit: cover; background: var(--rule); }
  .suggest .card h3 { margin: 0; font-weight: 500; font-size: 19px; }
  .suggest .card p { margin: 2px 0 0; font-size: 16px; color: var(--muted); line-height: 1.4; }
  .suggest .hint { font-size: 15px; color: var(--muted); font-style: italic; margin: 10px 0 0; }

  .colophon { margin-top: 64px; text-align: center; color: var(--muted); font-size: 15px; }
  .colophon a { font-style: italic; }
  .colophon p { margin: 6px 0; }

  /* ───────── Reader ───────── */
  #reader { position: fixed; inset: 0; background: var(--paper); display: none; flex-direction: column; user-select: none; -webkit-user-select: none; }
  #reader.open { display: flex; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 18px 10px; font-size: 15px; color: var(--muted); }
  .bar .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; text-align: center; flex: 1; }
  .bar button:hover { color: var(--ink); }
  .stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: stretch; padding: 4px 16px 8px; gap: 0; min-height: 0; }
  .leaf { flex: 1; max-width: 760px; background: var(--leaf); box-shadow: 0 1px 2px var(--shade), 0 8px 30px var(--shade); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px 22px 18px; min-width: 0; animation: turn .35s ease; }
  .spread .leaf:first-child { box-shadow: inset -14px 0 24px -18px var(--shade2), 0 8px 30px var(--shade); }
  .spread .leaf:last-child { box-shadow: inset 14px 0 24px -18px var(--shade2), 0 8px 30px var(--shade); }
  @keyframes turn { from { opacity: 0; transform: translateX(var(--dir, 12px)); } to { opacity: 1; transform: none; } }
  .leaf figure { margin: 0; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .leaf figure img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .leaf .cap { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; font-size: 15px; color: var(--muted); }
  .leaf .cap .who { color: var(--ink); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaf .cap a { white-space: nowrap; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .leaf .cap a:hover { color: var(--ink); border-color: var(--ink); }
  .leaf .folio { font-size: 13px; color: var(--muted); padding-top: 6px; font-variant-numeric: oldstyle-nums; }
  .leaf.blank { background: transparent; box-shadow: none; }
  .broken { color: var(--muted); font-style: italic; text-align: center; padding: 20px; }

  .opening { text-align: center; max-width: 440px; }
  .opening .kicker { color: var(--accent); font-size: 15px; }
  .opening h2 { font-weight: 400; font-size: 48px; line-height: 1.05; margin: 14px 0 18px; }
  .opening p { margin: 0 0 14px; color: var(--muted); }
  .opening .rule { width: 40px; height: 1px; background: var(--ink); margin: 22px auto; }
  .opening a { font-style: italic; }
  .opening .err { font-size: 15px; font-style: italic; }

  .progress { height: 2px; background: var(--rule); margin: 0 16px max(10px, env(safe-area-inset-bottom)); }
  .progress div { height: 100%; background: var(--ink); transition: width .3s ease; }

  /* ───────── Editing ───────── */
  .add-btn { margin-top: 18px; color: var(--accent); font-style: italic; font-size: 17px; border-bottom: 1px solid currentColor; }
  .acts { margin-top: 8px; display: flex; gap: 16px; font-size: 15px; }
  .acts button { color: var(--muted); font-style: italic; border-bottom: 1px solid var(--rule); }
  .acts button:hover { color: var(--ink); border-color: var(--ink); }
  .acts button.keep { color: var(--accent); border-color: currentColor; }
  .opening .edit { display: inline-block; margin-top: 6px; font-size: 15px; color: var(--muted); font-style: italic; border-bottom: 1px solid var(--rule); }

  #sheet { position: fixed; inset: 0; z-index: 20; background: rgba(36,33,28,.35); display: none; align-items: flex-end; justify-content: center; }
  #sheet.open { display: flex; }
  #sheet .panel { background: var(--leaf); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; padding: 26px 24px max(24px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(36,33,28,.2); animation: rise .25s ease; }
  @media (min-width: 640px) { #sheet { align-items: center; } #sheet .panel { border-radius: 2px; } }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  #sheet h2 { font-weight: 400; font-size: 30px; margin: 0 0 4px; }
  #sheet .sub { color: var(--muted); margin: 0 0 18px; font-size: 16px; }
  #sheet label { display: block; margin: 16px 0 4px; font-size: 15px; color: var(--muted); }
  #sheet input[type=text], #sheet input[type=url], #sheet input[type=password], #sheet textarea {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    padding: 6px 0; outline: none; border-radius: 0; }
  #sheet textarea { resize: vertical; min-height: 2.6em; }
  #sheet input:focus, #sheet textarea:focus { border-color: var(--ink); }
  .opening .sites a { margin: 0 6px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { border: 1px solid var(--rule); padding: 3px 12px; border-radius: 99px; font-size: 15px; }
  .chip.on { background: var(--ink); color: var(--leaf); border-color: var(--ink); }
  .seg { display: flex; gap: 0; margin-top: 6px; border: 1px solid var(--rule); width: max-content; }
  .seg button { padding: 4px 14px; font-size: 15px; }
  .seg button.on { background: var(--ink); color: var(--leaf); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }
  .primary { background: var(--ink); color: var(--leaf); padding: 9px 22px; font-size: 17px; }
  .primary[disabled] { opacity: .5; }
  .ghost { color: var(--muted); font-style: italic; }
  .danger { color: var(--accent); font-style: italic; }
  .msg { margin-top: 14px; font-size: 15px; color: var(--accent); min-height: 1em; }
  .steps { padding-left: 20px; margin: 8px 0 0; font-size: 16px; }
  .steps li { margin: 6px 0; }
  .steps a { color: var(--accent); }
  .fine { font-size: 14px; color: var(--muted); margin-top: 14px; }

  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--leaf);
    padding: 10px 18px; font-size: 16px; opacity: 0; transition: .25s ease; z-index: 30; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 600px) {
    body { font-size: 17px; }
    .mast h1 { font-size: 44px; }
    .stage { padding: 0 0 6px; }
    .leaf { box-shadow: none; padding: 16px 14px 12px; }
    .opening h2 { font-size: 40px; }
  }
</style>
</head>
<body>

<main id="contents"><p class="muted" style="text-align:center;padding-top:30vh">Opening the book…</p></main>

<section id="reader" aria-label="Reader">
  <div class="bar">
    <button id="close">← Contents</button>
    <div class="title" id="rtitle"></div>
    <div class="bar-r"><span id="rpage"></span><button class="theme" data-theme-toggle></button></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="progress"><div id="prog"></div></div>
</section>

<div id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"];
  const WEEK = 7 * 864e5;

  let data, following = [], suggested = [], lists = [];
  let pages = [], idx = 0, bookTitle = "", returnTo = "";

  // Link for editing the list on GitHub (works when hosted on username.github.io/repo)
  function editLink() {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    if (!m) return null;
    const repo = location.pathname.split("/").filter(Boolean)[0] || `${m[1]}.github.io`;
    return `https://github.com/${m[1]}/${repo}/edit/main/photographers.yml`;
  }

  const isNew = img => img.first_seen && (Date.now() - Date.parse(img.first_seen)) < WEEK;
  const host = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } };

  async function load() {
    try {
      const r = await fetch("images.json?v=" + Date.now());
      data = await r.json();
    } catch {
      data = { photographers: [] };
    }
    ingest();
    renderContents();
    route();
  }

  function ingest() {
    const people = data.photographers || [];
    following = people.filter(p => p.status !== "suggested");
    suggested = people.filter(p => p.status === "suggested");
    lists = [];
    following.forEach(p => (p.lists.length ? p.lists : ["Unsorted"]).forEach(l => { if (!lists.includes(l)) lists.push(l); }));
  }

  // ───────── Contents page ─────────
  function renderContents() {
    const edit = editLink();
    const updated = data.updated ? new Date(data.updated).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" }) : "";
    const latest = latestImages();
    const newCount = latest.filter(isNew).length;

    let h = `<div class="mast-top"><button class="theme" data-theme-toggle></button></div><header class="mast"><h1>Photobook</h1><p class="sc">${following.length} photographers · ${lists.length} chapters</p>
      <button class="add-btn" data-act="add">＋ Add a photographer</button></header>`;

    if (latest.length) {
      h += `<button class="latest" data-go="#/latest">
        <div class="strip">${latest.slice(0, 8).map(i => `<img src="${esc(i.src)}" alt="" loading="lazy" onerror="this.remove()">`).join("")}</div>
        <div class="label"><b>Latest pages</b><span class="muted">${newCount ? `<i>${newCount} new this week</i>` : "newest work from everyone"} →</span></div>
      </button>`;
    }

    lists.forEach((l, n) => {
      const people = following.filter(p => (p.lists.length ? p.lists : ["Unsorted"]).includes(l));
      h += `<section class="part"><div class="part-head"><h2><span class="num">${ROMAN[n] || n + 1}</span>${esc(l)}</h2>
        <button data-go="#/list/${encodeURIComponent(l)}">read chapter →</button></div><ul class="toc">`;
      people.forEach(p => {
        const fresh = p.images.filter(isNew).length;
        h += `<li data-go="#/p/${p.id}"><span class="name">${esc(p.name)}</span>${fresh ? `<span class="new">${fresh} new</span>` : ""}<span class="dots"></span>
          <span class="pg">${p.images.length ? p.images.length + " pp." : p.pending ? "<i>photos coming…</i>" : "visit site ↗"}</span></li>`;
      });
      h += `</ul></section>`;
    });

    if (suggested.length) {
      h += `<section class="suggest"><div class="part-head"><h2>Suggested</h2></div>`;
      suggested.forEach(p => {
        const t = p.images[0];
        h += `<div class="card" data-go="#/p/${p.id}">
          ${t ? `<img class="thumb" src="${esc(t.src)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="thumb"></div>`}
          <div><h3>${esc(p.name)}</h3><p>${esc(p.note || p.lists.join(", "))}</p>
            <div class="acts"><button class="keep" data-act="keep" data-id="${p.id}">Keep</button><button data-act="dismiss" data-id="${p.id}">Dismiss</button></div></div></div>`;
      });
      h += `<p class="hint">Tap a name to look through their pages first.</p></section>`;
    }

    h += `<footer class="colophon">
      <p><button class="add-btn" data-act="add" style="margin:0">＋ Add a photographer</button></p>
      ${edit ? `<p style="font-size:14px"><a href="${edit}" target="_blank" rel="noopener">Edit the list file on GitHub ↗</a></p>` : ""}
      ${updated ? `<p>Last updated ${esc(updated)}</p>` : ""}
      <p>Every photograph belongs to its photographer. Tap “view on site” to visit them.</p></footer>`;

    if (!following.length && !suggested.length) {
      h = `<header class="mast"><h1>Photobook</h1><p>The book is empty for now. Once the first daily update has run, your photographers will appear here.</p>
        <button class="add-btn" data-act="add">＋ Add a photographer</button></header>`;
    }
    $("#contents").innerHTML = h;
    Theme.paint();
  }

  function latestImages() {
    const all = [];
    following.forEach(p => p.images.forEach((img, i) => all.push({ ...img, person: p, order: i })));
    all.sort((a, b) => (Date.parse(b.first_seen) || 0) - (Date.parse(a.first_seen) || 0) || a.order - b.order);
    // Interleave so one photographer doesn't fill the whole section
    const by = new Map();
    all.forEach(x => { if (!by.has(x.person.id)) by.set(x.person.id, []); by.get(x.person.id).push(x); });
    const queues = [...by.values()], out = [];
    while (out.length < 60 && queues.some(q => q.length)) queues.forEach(q => q.length && out.push(q.shift()));
    return out;
  }

  // ───────── Building a book ─────────
  function chapterPages(p, kicker) {
    const out = [{ type: "open", person: p, kicker }];
    p.images.forEach((img, i) => out.push({ type: "photo", person: p, img, n: i + 1, of: p.images.length }));
    return out;
  }

  function openBook(kind, key, start) {
    pages = [];
    if (kind === "p") {
      const p = [...following, ...suggested].find(x => x.id === key);
      if (!p) return closeBook();
      bookTitle = p.name;
      pages = chapterPages(p, p.status === "suggested" ? "Suggested" : (p.lists[0] || ""));
    } else if (kind === "list") {
      bookTitle = key;
      const n = lists.indexOf(key);
      pages.push({ type: "part", title: key, num: ROMAN[n] || "" });
      following.filter(p => (p.lists.length ? p.lists : ["Unsorted"]).includes(key))
        .forEach(p => pages.push(...chapterPages(p, key)));
    } else if (kind === "latest") {
      bookTitle = "Latest pages";
      pages = latestImages().map((img, i, a) => ({ type: "photo", person: img.person, img, n: i + 1, of: a.length, showName: true }));
    }
    if (!pages.length) return closeBook();
    idx = Math.max(0, Math.min(pages.length - 1, start || 0));
    $("#reader").classList.add("open");
    document.body.style.overflow = "hidden";
    $("#rtitle").textContent = bookTitle;
    draw(0);
  }

  function closeBook() {
    $("#reader").classList.remove("open");
    document.body.style.overflow = "";
  }

  const perView = () => (innerWidth >= 1000 && innerWidth > innerHeight ? 2 : 1);

  function pageHTML(pg) {
    if (!pg) return `<div class="leaf blank"></div>`;
    if (pg.type === "part") {
      return `<div class="leaf"><div class="opening"><div class="kicker sc">chapter ${esc(pg.num)}</div><h2>${esc(pg.title)}</h2><div class="rule"></div><p>${following.filter(p => p.lists.includes(pg.title)).map(p => esc(p.name)).join(" · ")}</p></div></div>`;
    }
    if (pg.type === "open") {
      const p = pg.person;
      return `<div class="leaf"><div class="opening">
        ${pg.kicker ? `<div class="kicker sc">${esc(pg.kicker)}</div>` : ""}
        <h2>${esc(p.name)}</h2>
        ${p.note ? `<p>${esc(p.note)}</p>` : ""}
        <div class="rule"></div>
        <p>${p.images.length ? `${p.images.length} photographs` : ""}${p.lists.length ? ` · ${esc(p.lists.join(", "))}` : ""}</p>
        ${(p.sites || [p.site]).filter(Boolean).length ? `<p class="sites">${(p.sites || [p.site]).filter(Boolean).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener" data-stop>${esc(host(u))} ↗</a>`).join(" ")}</p>` : ""}
        ${p.error ? `<p class="err muted">${esc(p.error)}</p>` : ""}
        <button class="edit" data-stop data-act="edit" data-id="${p.id}">${p.status === "suggested" ? "Keep or dismiss" : "Edit"}</button>
      </div></div>`;
    }
    const { img, person } = pg;
    return `<div class="leaf">
      <figure><img src="${esc(img.src)}" alt="${esc(img.title || person.name)}" referrerpolicy="no-referrer"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'broken',textContent:'This photo couldn’t load here. Open it on their site.'}))"></figure>
      <div class="cap"><span class="who">${pg.showName ? esc(person.name) : esc(img.title || "")}${pg.showName && isNew(img) ? ` <span style="color:var(--accent)">· new</span>` : ""}</span>
        <a href="${esc(img.link || person.site)}" target="_blank" rel="noopener" data-stop>view on site ↗</a></div>
      <div class="folio">${pg.showName ? "" : `${pg.n} / ${pg.of}`}</div>
    </div>`;
  }

  function draw(dir) {
    const n = perView();
    if (n === 2) idx -= idx % 2;
    const stage = $("#stage");
    stage.className = "stage" + (n === 2 ? " spread" : "");
    stage.style.setProperty("--dir", dir < 0 ? "-12px" : "12px");
    stage.innerHTML = pageHTML(pages[idx]) + (n === 2 ? pageHTML(pages[idx + 1]) : "");
    $("#rpage").textContent = `${idx + 1}${n === 2 && pages[idx + 1] ? "–" + (idx + 2) : ""} of ${pages.length}`;
    $("#prog").style.width = `${Math.min(100, ((idx + n) / pages.length) * 100)}%`;
    // Preload the next few photos so turning pages feels instant
    pages.slice(idx + n, idx + n + 4).forEach(p => { if (p.img) { const i = new Image(); i.referrerPolicy = "no-referrer"; i.src = p.img.src; } });
    const h = location.hash.replace(/\/\d+$/, "");
    history.replaceState(null, "", `${h}/${idx}`);
  }

  function turn(step) {
    const n = perView();
    const next = idx + step * n;
    if (next < 0 || next >= pages.length) return;
    idx = next;
    draw(step);
  }

  // ───────── Light / dark ─────────
  const Theme = {
    get: () => document.documentElement.dataset.theme || "light",
    paint() {
      const dark = Theme.get() === "dark";
      document.querySelectorAll("[data-theme-toggle]").forEach(b => {
        b.textContent = dark ? "☀ Light" : "☾ Dark";
        b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      });
      document.querySelector('meta[name="theme-color"]').content = dark ? "#151412" : "#f3efe6";
    },
    toggle() {
      const t = Theme.get() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem("photobook_theme", t); } catch {}
      Theme.paint();
    },
  };
  Theme.paint();

  // ───────── Editing from the website ─────────
  // Saves changes straight into photographers.yml in your GitHub repository,
  // using a key (fine-grained token) that is stored only in this browser.
  const Editor = (() => {
    const TOKEN = "photobook_token", REPO = "photobook_repo";
    const YAML_LIB = "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js";
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
    };
    const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const hostOf = u => { try { return new URL(u).hostname.toLowerCase().replace(/^www\./, ""); } catch { return ""; } };
    // Same rule as fetch.py: named people go by their name, unnamed ones by their first website
    const entryId = e => e.name ? slugify(e.name) : slugify(hostOf(e.site || (e.pages || [])[0] || ""));
    const sameSite = u => String(u).toLowerCase().replace(/^https?:\/\/(www\.)?/, "").replace(/\/+$/, "");
    const panel = () => $("#panel");
    let busy = false, watchTimer = null;

    function repo() {
      const saved = store.get(REPO);
      if (saved) return saved;
      const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
      if (!m) return null;
      const first = location.pathname.split("/").filter(Boolean)[0];
      return `${m[1]}/${first && !first.includes(".") ? first : m[1] + ".github.io"}`;
    }

    function open(html) { panel().innerHTML = html; $("#sheet").classList.add("open"); }
    function close() { $("#sheet").classList.remove("open"); panel().innerHTML = ""; }
    $("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") close(); });

    function toast(text, ms = 3500) {
      const t = $("#toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => t.classList.remove("show"), ms);
    }

    // ── GitHub ──
    let yamlReady = null;
    function loadYaml() {
      if (window.jsyaml) return Promise.resolve();
      return yamlReady ||= new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = YAML_LIB;
        s.onload = res;
        s.onerror = () => { yamlReady = null; rej(new Error("Couldn’t load the editor. Check your internet connection and try again.")); };
        document.head.appendChild(s);
      });
    }

    async function gh(path, opts = {}, token = store.get(TOKEN), repoName = repo()) {
      const r = await fetch(`https://api.github.com/repos/${repoName}/contents/${path}`, {
        ...opts,
        cache: "no-store",
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(opts.body ? { "Content-Type": "application/json" } : {}),
        },
      });
      if (!r.ok) {
        const e = new Error(
          r.status === 401 ? "GitHub didn’t accept the key. It may have expired. Please connect again." :
          r.status === 403 || r.status === 404 ? "This key can’t edit your photobook. When making it, choose your photobook repository and “Contents: Read and write”." :
          `GitHub said no (error ${r.status}). Please try again.`);
        e.status = r.status;
        throw e;
      }
      return r.json();
    }

    const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
    const encode = str => { let bin = ""; new TextEncoder().encode(str).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };

    const ORDER = ["name", "site", "pages", "feeds", "follow", "lists", "note"];
    function tidy(p) {
      const o = {};
      ORDER.forEach(k => {
        const v = p[k];
        if (v == null || v === "" || (Array.isArray(v) && !v.length && k !== "lists")) return;
        o[k] = v;
      });
      Object.keys(p).forEach(k => { if (!ORDER.includes(k) && p[k] != null) o[k] = p[k]; });
      return o;
    }

    function serialize(L, original) {
      const header = [];
      for (const line of original.split("\n")) {
        if (line.startsWith("#") || !line.trim()) header.push(line); else break;
      }
      let body = jsyaml.dump({ following: L.following.map(tidy), suggested: L.suggested.map(tidy) },
        { lineWidth: -1, flowLevel: 3, noRefs: true });
      body = body.replace(/\n(  - )/g, "\n\n$1").replace(/\nsuggested:/, "\n\n\nsuggested:");
      return (header.join("\n").trim() ? header.join("\n").trimEnd() + "\n\n" : "") + body;
    }

    async function editList(mutate, message) {
      await loadYaml();
      for (let attempt = 0; attempt < 2; attempt++) {
        const file = await gh("photographers.yml");
        const text = decode(file.content);
        const doc = jsyaml.load(text) || {};
        const L = { following: (doc.following || []).filter(Boolean), suggested: (doc.suggested || []).filter(Boolean) };
        mutate(L);
        try {
          await gh("photographers.yml", { method: "PUT", body: JSON.stringify({ message, content: encode(serialize(L, text)), sha: file.sha }) });
          return;
        } catch (e) {
          if ((e.status === 409 || e.status === 422) && attempt === 0) continue;
          throw e;
        }
      }
    }

    function findIn(L, id) {
      for (const sec of ["following", "suggested"]) {
        const i = L[sec].findIndex(p => entryId(p) === id);
        if (i >= 0) return { sec, i };
      }
      return null;
    }

    // After a save, keep checking for the new photos and show them when they arrive
    function watch() {
      clearInterval(watchTimer);
      const since = data.updated, started = Date.now();
      watchTimer = setInterval(async () => {
        if (Date.now() - started > 15 * 60e3) return clearInterval(watchTimer);
        try {
          const fresh = await (await fetch("images.json?v=" + Date.now())).json();
          if (fresh.updated && fresh.updated !== since) {
            clearInterval(watchTimer);
            data = fresh;
            ingest();
            renderContents();
            if ($("#reader").classList.contains("open")) route();
            toast("New photos have arrived.");
          }
        } catch {}
      }, 30e3);
    }

    function refreshViews(newHash) {
      ingest();
      renderContents();
      if (newHash !== undefined && location.hash !== newHash) location.hash = newHash;
      else if ($("#reader").classList.contains("open")) route();
    }

    async function run(btn, work, done) {
      if (busy) return;
      busy = true;
      const msg = $(".msg", panel());
      const label = btn && btn.textContent;
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      if (msg) msg.textContent = "";
      try {
        await work();
        done();
        watch();
      } catch (e) {
        if (e.status === 401) store.set(TOKEN, null);
        if (msg) msg.textContent = e.message; else toast(e.message, 6000);
        if (btn) { btn.disabled = false; btn.textContent = label; }
      } finally {
        busy = false;
      }
    }

    // ── Screens ──
    function connect(then) {
      const r = repo();
      const owner = r ? r.split("/")[0] : "";
      const link = "https://github.com/settings/personal-access-tokens/new?" + new URLSearchParams({
        name: "Photobook", description: "Lets my photobook website save my photographer list",
        expires_in: "366", contents: "write", ...(owner ? { target_name: owner } : {}),
      });
      open(`<h2>Connect your book</h2>
        <p class="sub">To save changes, the book needs a key from GitHub that only works on your photobook. You do this once on each phone or computer.</p>
        <ol class="steps">
          <li><a href="${link}" target="_blank" rel="noopener">Open GitHub to make the key ↗</a> (most of it is filled in for you).</li>
          <li>Under <b>Repository access</b>, choose <b>Only select repositories</b> and pick <b>${esc(r ? r.split("/")[1] : "photobook")}</b>.</li>
          <li>Tap <b>Generate token</b> at the bottom, then copy the key. It starts with <i>github_pat_</i>.</li>
          <li>Come back here and paste it below.</li>
        </ol>
        ${r ? "" : `<label>Your repository (username/photobook)</label><input type="text" id="f-repo" autocapitalize="off" autocorrect="off" placeholder="username/photobook">`}
        <label>Key</label><input type="password" id="f-token" autocomplete="off" placeholder="github_pat_…">
        <div class="msg"></div>
        <div class="row"><button class="ghost" id="f-cancel">Cancel</button><button class="primary" id="f-go">Connect</button></div>
        <p class="fine">The key is kept only in this browser on this device. It isn’t part of the website, so visitors can’t see it. You can delete it on GitHub at any time.</p>`);
      $("#f-cancel").onclick = close;
      $("#f-go").onclick = async () => {
        const token = $("#f-token").value.trim();
        const repoName = r || ($("#f-repo")?.value || "").trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
        const msg = $(".msg", panel());
        if (!token) return msg.textContent = "Paste the key first.";
        if (!/^[^/\s]+\/[^/\s]+$/.test(repoName)) return msg.textContent = "Enter your repository as username/photobook.";
        $("#f-go").disabled = true; $("#f-go").textContent = "Checking…";
        try {
          await gh("photographers.yml", {}, token, repoName);
          store.set(TOKEN, token);
          if (!r) store.set(REPO, repoName);
          toast("Connected. You can now edit from the book.");
          then ? then() : close();
        } catch (e) {
          msg.textContent = e.message;
          $("#f-go").disabled = false; $("#f-go").textContent = "Connect";
        }
      };
    }

    function form(p) {
      const isNew = !p;
      const oldId = p && p.id;     // p gets updated after saving, so remember who this was
      const all = [...new Set([...following, ...suggested].flatMap(x => x.lists))];
      const chosen = new Set(p ? p.lists : []);
      let section = p ? p.status : "following";
      open(`<h2>${isNew ? "Add a photographer" : esc(p.name)}</h2>
        <p class="sub">${isNew ? "Their photos appear in your book a few minutes after you save." : "Change their details, or remove them from your book."}</p>
        <label>Websites with their photos</label>
        <textarea id="f-sites" rows="3" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste one or more websites, one per line">${esc(p ? (p.sites && p.sites.length ? p.sites : [p.site]).filter(Boolean).join("\n") : "")}</textarea>
        <label>Name <span style="font-style:italic">(optional)</span></label><input type="text" id="f-name" value="${esc(p && !p.auto_name ? p.name : "")}" placeholder="${p && p.auto_name ? esc(p.name) + " (found automatically)" : "Leave blank to find it automatically"}">
        <label>Chapters</label><div class="chips" id="f-chips"></div>
        <input type="text" id="f-newlist" placeholder="＋ New chapter (type and press Enter)" style="margin-top:8px">
        <label>Your note (optional)</label><textarea id="f-note" rows="2">${esc(p?.note || "")}</textarea>
        <label>Section</label><div class="seg" id="f-seg"><button data-s="following">Following</button><button data-s="suggested">Suggested</button></div>
        <div class="msg"></div>
        <div class="row">${isNew ? `<button class="ghost" id="f-cancel">Cancel</button>` : `<button class="danger" id="f-remove">Remove</button>`}
          <button class="primary" id="f-save">${isNew ? "Add to book" : "Save"}</button></div>
        <p class="fine">Tip: if the photos don’t show up, try the address of their gallery or portfolio page rather than their home page. <button class="ghost" id="f-disconnect" style="font-size:14px;text-decoration:underline">Disconnect this device</button></p>`);

      const grow = () => { const t = $("#f-sites"); t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight, 70) + "px"; };
      $("#f-sites").addEventListener("input", grow);
      setTimeout(grow, 0);

      const drawChips = () => {
        const names = [...new Set([...all, ...chosen])];
        $("#f-chips").innerHTML = names.map(l => `<button class="chip${chosen.has(l) ? " on" : ""}" data-l="${esc(l)}">${esc(l)}</button>`).join("");
      };
      const drawSeg = () => panel().querySelectorAll("#f-seg button").forEach(b => b.classList.toggle("on", b.dataset.s === section));
      drawChips(); drawSeg();
      $("#f-chips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; const l = c.dataset.l; chosen.has(l) ? chosen.delete(l) : chosen.add(l); drawChips(); };
      $("#f-seg").onclick = e => { const b = e.target.closest("button"); if (b) { section = b.dataset.s; drawSeg(); } };
      const addList = () => {
        const v = $("#f-newlist").value.split(",").map(s => s.trim()).filter(Boolean);
        v.forEach(l => chosen.add(l.replace(/(^|\s)\S/g, c => c.toUpperCase())));
        $("#f-newlist").value = ""; drawChips();
      };
      $("#f-newlist").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addList(); } });
      $("#f-newlist").addEventListener("blur", addList);
      if ($("#f-cancel")) $("#f-cancel").onclick = close;
      $("#f-disconnect").onclick = () => { store.set(TOKEN, null); store.set(REPO, null); close(); toast("This device is disconnected."); };

      $("#f-save").onclick = () => {
        addList();
        const msg = $(".msg", panel());
        const name = $("#f-name").value.trim();
        const note = $("#f-note").value.trim();

        // Websites: any mix of new lines, spaces or commas between them
        const sites = [];
        for (const raw of $("#f-sites").value.split(/[\s,]+/).filter(Boolean)) {
          let u = raw.replace(/[)\].;]+$/, "");
          if (!/^https?:\/\//i.test(u)) u = "https://" + u;
          let ok = true;
          try { const h = new URL(u).hostname; ok = h.includes(".") && !h.includes("%"); } catch { ok = false; }
          if (!ok) { $("#f-sites").focus(); return msg.textContent = `“${raw}” doesn’t look like a website address.`; }
          if (!sites.some(x => sameSite(x) === sameSite(u))) sites.push(u);
        }
        if (!sites.length) return msg.textContent = "Add at least one website.";
        const site = sites[0], pages = sites.slice(1);

        const id = name ? slugify(name) : slugify(hostOf(site));
        if (!id) return msg.textContent = "Use a name with letters or numbers.";
        const others = [...following, ...suggested].filter(x => !p || x.id !== p.id);
        const clash = others.find(x => x.id === id);
        if (clash) return msg.textContent = `${clash.name} is already in your book.`;
        for (const x of others) {
          const dup = (x.sites || [x.site]).find(u => sites.some(v => sameSite(u) === sameSite(v)));
          if (dup) return msg.textContent = `${hostOf(dup)} is already in your book, under ${x.name}.`;
        }
        const listsOut = [...chosen];
        const label = name || (p && p.auto_name ? p.name : hostOf(site));

        run($("#f-save"), () => editList(L => {
          const at = p && findIn(L, p.id);
          const entry = at ? L[at.sec][at.i] : {};
          if (name) entry.name = name; else delete entry.name;
          Object.assign(entry, { site, pages, lists: listsOut, note });
          if (at && at.sec === section) return;           // stays in the same place
          if (at) L[at.sec].splice(at.i, 1);
          L[section].push(entry);
        }, `${isNew ? "Add" : "Update"} ${label}`), () => {
          const local = p ? data.photographers.find(x => x.id === oldId) : null;
          if (local) {
            const before = (local.sites || [local.site]).join(" ");
            Object.assign(local, { id, name: label, auto_name: !name, site, sites, lists: listsOut, note, status: section });
            if (before !== sites.join(" ")) {
              local.pending = true;
              if (!local.images.length) local.error = "Photos are on their way. They usually appear within a few minutes.";
            }
          } else {
            data.photographers.push({ id, name: label, auto_name: !name, site, sites, lists: listsOut, note, status: section, images: [], pending: true,
              error: name ? "Photos are on their way. They usually appear within a few minutes."
                          : "Their name and photos are on their way. They usually appear within a few minutes." });
          }
          close();
          toast(isNew ? (name ? `${name} added. Photos arrive in a few minutes.` : "Added. Their name and photos arrive in a few minutes.")
                      : sites.length > 1 ? "Saved. Photos from every website arrive in a few minutes." : "Saved.");
          refreshViews(oldId && oldId !== id && location.hash.includes(oldId) ? `#/p/${id}` : undefined);
        });
      };

      if ($("#f-remove")) {
        $("#f-remove").onclick = () => {
          const b = $("#f-remove");
          if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to remove"; return; }
          run(b, () => editList(L => { const at = findIn(L, p.id); if (at) L[at.sec].splice(at.i, 1); }, `Remove ${p.name}`), () => {
            data.photographers = data.photographers.filter(x => x.id !== p.id);
            close();
            toast(`${p.name} removed.`);
            refreshViews(location.hash.includes(p.id) ? "" : undefined);
          });
        };
      }
      if (isNew) setTimeout(() => $("#f-sites")?.focus(), 50);
    }

    function quick(kind, id) {
      const p = data.photographers.find(x => x.id === id);
      if (!p) return;
      run(null, () => editList(L => {
        const at = findIn(L, id);
        if (!at) return;
        const [entry] = L[at.sec].splice(at.i, 1);
        if (kind === "keep") L.following.push(entry);
      }, `${kind === "keep" ? "Keep" : "Dismiss"} ${p.name}`), () => {
        if (kind === "keep") p.status = "following";
        else data.photographers = data.photographers.filter(x => x.id !== id);
        toast(kind === "keep" ? `${p.name} moved into your book.` : `${p.name} dismissed.`);
        refreshViews(kind === "dismiss" && location.hash.includes(id) ? "" : undefined);
      });
    }

    function action(kind, id) {
      const go = () => {
        if (kind === "add") form(null);
        else if (kind === "edit") form(data.photographers.find(x => x.id === id));
        else quick(kind, id);
      };
      if (!repo() || !store.get(TOKEN)) return connect(kind === "keep" || kind === "dismiss" ? () => { close(); go(); } : go);
      go();
    }

    return { action, close };
  })();

  // ───────── Routing ─────────
  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
    const [kind, a, b] = parts;
    if (kind === "p") openBook("p", a, +b || 0);
    else if (kind === "list") openBook("list", a, +b || 0);
    else if (kind === "latest") openBook("latest", null, +a || 0);
    else closeBook();
  }

  function go(hash) {
    returnTo = scrollY;
    location.hash = hash;
  }

  window.addEventListener("hashchange", route);

  document.addEventListener("click", e => {
    if (e.target.closest("[data-theme-toggle]")) { e.stopPropagation(); return Theme.toggle(); }
    const act = e.target.closest("[data-act]");
    if (act) { e.preventDefault(); e.stopPropagation(); return Editor.action(act.dataset.act, act.dataset.id); }
    const t = e.target.closest("[data-go]");
    if (t) { e.preventDefault(); go(t.dataset.go); }
  });

  $("#close").addEventListener("click", () => {
    location.hash = "";
    closeBook();
    if (returnTo) setTimeout(() => scrollTo(0, returnTo), 0);
  });

  // Tap the left third to go back, anywhere else to go forward
  $("#stage").addEventListener("click", e => {
    if (e.target.closest("[data-stop]")) return;
    const x = e.clientX / innerWidth;
    turn(x < 0.33 ? -1 : 1);
  });

  let sx = null, sy = null;
  $("#stage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("#stage").addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); turn(dx < 0 ? 1 : -1); }
  });

  document.addEventListener("keydown", e => {
    if ($("#sheet").classList.contains("open")) { if (e.key === "Escape") Editor.close(); return; }
    if (!$("#reader").classList.contains("open")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); turn(1); }
    if (e.key === "ArrowLeft") turn(-1);
    if (e.key === "Escape") $("#close").click();
  });

  addEventListener("resize", () => { if ($("#reader").classList.contains("open")) draw(0); });

  load();
})();
</script>
</body>
</html>
